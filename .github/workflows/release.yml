name: release

# A version tag (v2.2.0) publishes a GitHub Release with mimir.skill attached,
# so https://github.com/533konrad/mimir/releases/latest/download/mimir.skill
# always serves the newest bundle. Cutting a version stays a human decision.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML (test-only)
        run: python -m pip install --quiet pyyaml

      - name: Tests must pass before anything is published
        run: python -m unittest discover -s tests -v
        env:
          MIMIR_NO_OPEN: "1"

      - name: Build mimir.skill and release notes
        run: |
          python scripts/build_skill.py --out dist/mimir.skill
          python scripts/build_skill.py --notes "${GITHUB_REF_NAME#v}" > dist/notes.md

      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/mimir.skill --title "Mimir ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
